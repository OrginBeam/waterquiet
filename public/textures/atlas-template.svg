<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128">
  <!-- WaterQuiet 方块纹理图集模板
       128×128，4×4 网格，每格 32×32。
       用法：用 SVG 编辑器（Inkscape / Figma / 浏览器插件）打开，把每格改成你要的纹理，
       然后导出为 128×128 PNG，命名为 atlas.png 放在本目录。 -->
  <defs>
    <style>
      text { font-family: sans-serif; font-size: 7px; fill: #fff; text-anchor: middle; }
      .grid { stroke: rgba(255,255,255,0.35); stroke-width: 1; fill: none; }
    </style>
  </defs>

  <!-- 占位色块（可替换为你画的纹理） -->
  <rect x="0"  y="0"  width="32" height="32" fill="#6db53e"/> <!-- 0 grass_top 草方块顶 -->
  <rect x="32" y="0"  width="32" height="32" fill="#6db53e"/> <!-- 1 grass_side 草方块侧 -->
  <rect x="64" y="0"  width="32" height="32" fill="#8a5a2b"/> <!-- 2 dirt 泥土 -->
  <rect x="96" y="0"  width="32" height="32" fill="#8c8c8c"/> <!-- 3 stone 石头 -->
  <rect x="0"  y="32" width="32" height="32" fill="#d9c58a"/> <!-- 4 sand 沙子 -->
  <rect x="32" y="32" width="32" height="32" fill="#6b4a2b"/> <!-- 5 wood_side 原木侧 -->
  <rect x="64" y="32" width="32" height="32" fill="#6b4a2b"/> <!-- 6 wood_top 原木顶 -->
  <rect x="96" y="32" width="32" height="32" fill="#4e8a2a"/> <!-- 7 leaves 树叶 -->
  <rect x="0"  y="64" width="32" height="32" fill="#f2f5f7"/> <!-- 8 snow 雪 -->
  <rect x="32" y="64" width="32" height="32" fill="#9cc8e8"/> <!-- 9 ice 冰 -->
  <rect x="64" y="64" width="32" height="32" fill="#8a8a86"/> <!-- 10 gravel 砂砾 -->
  <rect x="96" y="64" width="32" height="32" fill="#9aa0a8"/> <!-- 11 clay 粘土 -->
  <rect x="0"  y="96" width="32" height="32" fill="#c77b3f"/> <!-- 12 redsand 红沙 -->
  <rect x="32" y="96" width="32" height="32" fill="#9a6a5a"/> <!-- 13 granite 花岗岩 -->
  <rect x="64" y="96" width="32" height="32" fill="#c0c0c0"/> <!-- 14 diorite 闪长岩 -->
  <rect x="96" y="96" width="32" height="32" fill="#9c9c98"/> <!-- 15 andesite 安山岩 -->

  <!-- 网格线 -->
  <g class="grid">
    <rect x="0" y="0" width="128" height="128"/>
    <line x1="32" y1="0" x2="32" y2="128"/>
    <line x1="64" y1="0" x2="64" y2="128"/>
    <line x1="96" y1="0" x2="96" y2="128"/>
    <line x1="0" y1="32" x2="128" y2="32"/>
    <line x1="0" y1="64" x2="128" y2="64"/>
    <line x1="0" y1="96" x2="128" y2="96"/>
  </g>

  <!-- 瓦片标注（导出前可删除文字） -->
  <text x="16"  y="18">草顶</text>
  <text x="48"  y="18">草侧</text>
  <text x="80"  y="18">泥土</text>
  <text x="112" y="18">石头</text>
  <text x="16"  y="50">沙子</text>
  <text x="48"  y="50">原木侧</text>
  <text x="80"  y="50">原木顶</text>
  <text x="112" y="50">树叶</text>
  <text x="16"  y="82">雪</text>
  <text x="48"  y="82">冰</text>
  <text x="80"  y="82">砂砾</text>
  <text x="112" y="82">粘土</text>
  <text x="16"  y="114">红沙</text>
  <text x="48"  y="114">花岗岩</text>
  <text x="80"  y="114">闪长岩</text>
  <text x="112" y="114">安山岩</text>
</svg>
